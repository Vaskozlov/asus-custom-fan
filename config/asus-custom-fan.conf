# ASUS custom fan curve configuration
#
# The controller reads a Linux hwmon temperature sensor and maps it to a manual
# fan percentage through asus-fan-control-ec.

[general]
# "auto" prefers AMD k10temp/Tctl, then Intel coretemp/Package id 0, then a
# reasonable hwmon/thermal-zone fallback. You can also set an absolute sysfs
# path such as /sys/class/hwmon/hwmon7/temp1_input.
sensor = auto

# Main polling interval.
interval_seconds = 2.0

# When temperature is falling, retain the current band until the temperature
# is this many degrees below that band's threshold.
hysteresis_c = 2

# Re-apply the current manual setting periodically. This recovers from firmware
# profile/AC events that silently return the EC to automatic mode.
reassert_seconds = 20

# Periodic informational log interval. Set 0 to log only transitions/errors.
log_seconds = 60

# Hard safety override. At or above this temperature the controller requests
# 100%, regardless of the curve below. Your curve already reaches 100% at 80C,
# so this is mainly a guard against accidental future config edits.
panic_temp_c = 90

[curve]
# temperature_c = fan_percent
# Below the first threshold, the first percentage is used.
0 = 0
60 = 25
65 = 35
70 = 50
75 = 75
80 = 100
